<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendendo Caixas</title>
    <style>
        h1 { /* Box-Level */
            
            background-color: #6aa06aa8;
            height: 300px;
            width: 371px;

            border: 10px solid #0d4e0d6b;

            padding: 10px;

            margin: 10px 10px 20px 10px;

            outline: 5px dashed #b47d2ad2;
        }

        a { /* Inline-Level */    

            border: 5px solid #a34343;
        
            padding: 1.5px;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>.Vamos ver como tudo isso funciona.</a></p>


</body>
</html>
