<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a{
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: darkred;
        }

        a:hover {
            text-decoration: underline;
            text-decoration-color: rgb(155, 155, 65);            
        }

        a:active {
            color: darkgoldenrod;
        }

        a::before {
            content: '>';
            text-decoration: none;
            font-weight: normal;
            color: rgb(139, 139, 139);
        }

        a::after {
            content: '<';
            text-decoration: none;
            font-weight: normal;
            color: rgb(139, 139, 139);
        }

        .especial {
            background-color: rgba(185, 84, 84, 0.562);
        }
        
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io" target="blank" ref="external">Repositório Github</a></li>
        <li><a href="https://youtube.com/cursoemvideo/" target="blank" ref="external" class="especial">Canal do Youtube</a></li>
        <li><a href="https://www.cursoemvideo.com" target="blank" ref="external">Site do CursoemVideo</a></li>
    </ul>
</body>
</html>
