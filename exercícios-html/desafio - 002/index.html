<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags em Lista</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <ul>
    <li><abbr title="use a tag &lt;a&gt;">Parágrafo</abbr></li>
    <li><abbr title="use a tag &lt;strong&gt;"><strong>Negrito</strong></abbr></li>
    <li><abbr title="use a tag &lt;em&gt;"><em>Itálico</em></abbr></li>
    <li><abbr title="use a tag &lt;mark&gt;"><mark>Marcação</mark></abbr></li>
    <li><abbr title="use a tag &lt;ol&gt;">Listas Organizadas</abbr></li>
   <li><abbr title="use a tag &lt;code&gt;"><code>Para deixar espaçamento entre letras de forma igual</code></abbr></li>
    <li><abbr title="use a tag &lt;h3&gt;"><h3>Para marcar um texto como título, variando os níveis dele.</h3></abbr></li>
    <li><abbr title="use a tag &lt;ol type='#'">Para mudar o tipo de ordem em uma lista</abbr></li>
    </ul>
</body>
</html>
