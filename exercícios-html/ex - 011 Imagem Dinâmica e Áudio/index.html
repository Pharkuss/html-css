<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Para testar a imagem flexivel, aumente e diminua a página.</p>
    <picture>
        <source media="(max-width: 750px)" srcset="Imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="Imagens/foto-m.png" type="image/png">
        <img src="Imagens/foto-g.png" alt="Imagem flexivel G">
    </picture>
    <!--Para .png, o type="image/png" é amplamente displensável, já que a maioria dos navegadores tem extensões que suportam o tipo do arquivo. O type é mais utilizado para alternativas de tipo de arquivo, podendo ser usado como opções pra máquina ler o código.-->
    <h1>Reproduzindo Áudios</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5.</p>
    <audio preload="metadata" controls>
        <source src="midia/guanacast-33.mp3" type="audio/mpeg">
        <source src="midia/guanacast-33.igg" type="audio/ogg">
        <source src="midia/guanacast-33.wav" type="audio/wav">
    </audio>
    <p>Infelizmente o seu navegador não suporta áudio.<a href="midia/guanacast-33.mp3">Clique aqui para baixar o arquivo MP3.</a></p>
    
</body>
</html>
